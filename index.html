<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASEBALL SCOUTER</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08101d;color:#eef4ff;font:15px Arial,"Noto Sans KR",sans-serif}
button,input{font:inherit}.app{display:flex;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:235px;background:#0c1424;border-right:1px solid #293a58;padding:15px;overflow:auto}.logo{font-weight:900;font-size:19px;margin:10px}.logo b{color:#5c98ff}.nav{width:100%;border:0;background:transparent;color:#aebbd2;padding:10px;border-radius:8px;text-align:left;margin:2px 0;cursor:pointer}.nav:hover,.nav.active{background:#1a2945;color:white}.main{margin-left:235px;width:calc(100% - 235px)}header{height:70px;position:sticky;top:0;z-index:5;background:#0c1424f2;border-bottom:1px solid #293a58;display:flex;justify-content:space-between;align-items:center;padding:0 24px}.topstats{display:flex;gap:16px;color:#a8b8d3}.budget{color:#ffd05a;font-size:20px;font-weight:900}.content{padding:24px;max-width:1500px;margin:auto}.hero{min-height:250px;padding:30px;border:1px solid #30415f;border-radius:18px;background:radial-gradient(circle at 50% 15%,#294572,#111c30 68%);display:flex;align-items:end}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.panel,.card{background:#121c30;border:1px solid #2a3a59;border-radius:13px;padding:17px}.card{background:#182640}h1{margin:0 0 8px;font-size:30px}h2{margin:0 0 13px}.stat{font-size:28px;font-weight:900}.muted{color:#91a3c2}.gold{color:#ffd05a}.good{color:#42d49b}.bad{color:#ff7184}.btn{border:0;border-radius:8px;background:#4e8cff;color:#fff;padding:9px 13px;font-weight:700;cursor:pointer}.btn.gray{background:#2b3b59}.btn.green{background:#22986e}.btn.red{background:#b73f55}.btn.gold{background:#b9861d}.btn:disabled{opacity:.4;cursor:not-allowed}.actions,.form{display:flex;gap:8px;flex-wrap:wrap}input{background:#0d1728;border:1px solid #31425f;color:white;padding:10px;border-radius:8px}.tag{display:inline-block;padding:4px 8px;background:#263754;border-radius:99px;font-size:12px;margin:2px}.avatar{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#304c78,#18263f);font-size:34px;border:2px solid #51698e;flex:none}.player{display:flex;gap:13px}.player>div:last-child{flex:1}.progress{height:8px;background:#293752;border-radius:99px;overflow:hidden}.progress div{height:100%;background:#5795ff}.news{padding:11px 0;border-bottom:1px solid #293853}.rank{display:grid;grid-template-columns:35px 1fr 60px 60px 60px;padding:9px;border-bottom:1px solid #293853}.rank.me{background:#1c3156;border-radius:7px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px;border-bottom:1px solid #293853;text-align:left;white-space:nowrap}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal>div{width:min(650px,100%);max-height:90vh;overflow:auto;background:#121c30;border:1px solid #344766;border-radius:15px;padding:20px}.hidden{display:none}.Common{color:#c5d0e2}.Rare{color:#5ca8ff}.Epic{color:#b875ff}.Legend{color:#ffc34d}.Mystic{color:#ff6ec7}.notice{padding:13px;border-radius:10px;background:#182640;border:1px solid #344766;margin:12px 0}
@media(max-width:850px){.side{width:185px}.main{margin-left:185px;width:calc(100% - 185px)}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.app{display:block}.side{position:static;width:100%;height:auto}.main{margin:0;width:100%}header{position:static;height:auto;gap:10px;flex-wrap:wrap;padding:15px}.grid,.grid2{grid-template-columns:1fr}.topstats{gap:8px;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="logo">⚾ <b>BASEBALL</b> SCOUTER</div><div id="nav"></div></aside>
<main class="main">
<header><div><b id="club"></b><span id="phase" class="muted"></span></div><div class="topstats">📅 <b id="year"></b> 💰 <b id="money" class="budget"></b> ❤️ <b id="fan"></b></div></header>
<section id="content" class="content"></section>
</main>
</div>
<div id="modal" class="modal hidden"><div id="modalBox"></div></div>

<script>
"use strict";

const KEY="BASEBALL_SCOUTER_FIXED_V4";
const MIN_BUDGET=50;
const GRADES=["Common","Rare","Epic","Legend","Mystic"];
const GRADE_INFO={
  Common:{chance:.70,xp:1,bonus:0},
  Rare:{chance:.20,xp:1.5,bonus:4},
  Epic:{chance:.07,xp:2,bonus:8},
  Legend:{chance:.025,xp:3,bonus:13},
  Mystic:{chance:.005,xp:5,bonus:20}
};
const POS=["C","1B","2B","3B","SS","LF","CF","RF","DH","SP","RP"];
const NAMES=[
"김민준","이준호","박도윤","최현우","정우진","강민재","윤서준","한지훈","임도현","조성민",
"송지후","오승현","장민석","배준영","문태윤","신재호","권태성","이강우","김도현","서준혁",
"김태윤","박건우","이승민","최준혁","정민석","강현우","윤지호","한승우","임재현","조현우",
"송민재","오지훈","장우진","배성훈","문현준","신현우","권민재","이도윤","서태양","김준서",
"박시우","최민재","정현준","강준영","윤도현","한재민","임성민","조민혁","송현우","오준영",
"장현수","배지훈","문준혁","신민석","권준우","이현우","서준영","김지훈","박정우","최도윤",
"정재현","강민석","윤성준","한도윤","임지훈","조태현","송준혁","오현우","장민재","배현우",
"문지훈","신도윤","권현우","이준혁","서민재","김현수","박준영","최지훈","정도윤","강태윤",
"윤준서","한민재","임도윤","조민재","송도윤","오태현","장준혁","배민석","문현우","신준영",
"권도윤","이태현","서현우"
];
const FOREIGN=["Alex Carter","Mike Wilson","Ryan Cooper","Jason Brown","Daniel Miller","Chris Adams","Kevin Hall","Lucas Martin","Noah Clark","Ethan Walker","Jack Wilson","Liam Taylor","Evan Scott","Adam Davis","Leo Anderson","Max Turner","Jake Martin","Kyle Brown","Sam Wilson","Ben Carter","Luke Davis","Nick Johnson","Alex Parker","Eric White","James Clark","Ryan Walker"];
const NAV=[
["home","🏟️ 구단 홈"],["stadium","🏗️ 구장 업그레이드"],["roster","👥 선수단"],["lineup","📋 라인업"],["develop","📈 선수 육성"],
["draw","🎰 선수 뽑기"],["scout","🔎 국내 스카우팅"],["overseas","🌎 해외 스카우팅"],["draft","📋 신인 드래프트"],
["fa","💵 FA 시장"],["trade","🤝 트레이드"],["season","⚾ 시즌"],["news","📰 뉴스"],["history","📜 거래 기록"],["awards","🏆 시즌 기록"]
];
let page="home", game=null, autoTimer=null;

const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=x=>String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const money=x=>Math.round(x*10)/10;

function save(){try{localStorage.setItem(KEY,JSON.stringify(game));}catch(e){}}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return false;
    game=JSON.parse(raw);
    normalize();
    return true;
  }catch(e){game=null;return false}
}
function normalize(){
  if(!game||typeof game!=="object")return;
  game.budget=Number.isFinite(+game.budget)?+game.budget:80;
  game.year=Number(game.year)||2026; game.morale=clamp(Number(game.morale)||70,0,100);
  game.games=clamp(Number(game.games)||0,0,144); game.total=144;
  for(const k of ["roster","prospects","draft","fa","news","tx","awards","history"])if(!Array.isArray(game[k]))game[k]=[];
  game.league=Array.isArray(game.league)&&game.league.length?game.league:makeLeague();
  game.train=Number(game.train)||8; game.last=game.last||null;
  game.stadiumLevel=clamp(Number(game.stadiumLevel)||0,0,5);
  game.stadiumUpgradeCost=100; game.championPremium=Number(game.championPremium)||0;
  game.pendingDecision=null;
  game.phase=game.games>=144?"정규시즌 종료":(game.games?"시즌 진행 중":"시즌 시작 전");
  game.roster=game.roster.map(normalizePlayer);
  game.prospects=game.prospects.map(normalizePlayer);
  game.draft=game.draft.map(normalizePlayer);
  game.fa=game.fa.map(normalizePlayer);
}
function normalizePlayer(p){
  p=p||{};
  if(!GRADES.includes(p.grade))p.grade="Common";
  p.id=p.id||uid(); p.name=p.name||pick(NAMES); p.pos=p.pos||pick(POS);
  p.age=Number(p.age)||20;p.ovr=Number(p.ovr)||55;p.salary=Number(p.salary)||1;p.years=Number(p.years)||3;p.left=Number(p.left)||3;
  p.foreign=!!p.foreign;p.xp=Number(p.xp)||0;p.need=Number(p.need)||100;p.games=Number(p.games)||0;
  p.ab=Number(p.ab)||0;p.h=Number(p.h)||0;p.hr=Number(p.hr)||0;p.rbi=Number(p.rbi)||0;p.w=Number(p.w)||0;p.l=Number(p.l)||0;
  p.era=Number(p.era)||4.5;p.fatigue=Number(p.fatigue)||0;p.def=Number(p.def)||60;
  return p;
}
function makeLeague(){
  return ["서울 라이온즈","부산 웨일스","인천 스톰","대구 피닉스","광주 타이거즈","대전 이글스","수원 블레이즈","창원 나이츠","울산 마리너스","제주 돌핀스"].map(name=>({name,w:0,l:0,run:0}));
}
function createPlayer(o={}){
  const grade=o.grade||rollGrade(), info=GRADE_INFO[grade], foreign=!!o.foreign;
  return normalizePlayer({
    id:uid(),name:o.name||pick(foreign?FOREIGN:NAMES),age:o.age??rand(18,34),pos:o.pos||pick(POS),
    grade,ovr:cl((o.ovr??rand(50,72))+info.bonus,45,95),salary:o.salary??rand(1,6),
    years:o.years??3,left:o.left??3,foreign,xp:0,need:100,games:0,ab:0,h:0,hr:0,rbi:0,w:0,l:0,
    era:rand(280,520)/100,fatigue:rand(0,15),def:rand(45,82)
  });
}
function rollGrade(){
  let x=Math.random(),s=0;
  for(const grade of GRADES){s+=GRADE_INFO[grade].chance;if(x<s)return grade}
  return "Mystic";
}
function newGame(club,year){
  game={
    club,year:Number(year)||2026,budget:80,morale:70,games:0,total:144,phase:"시즌 시작 전",
    league:makeLeague(),roster:Array.from({length:12},()=>createPlayer()),
    prospects:Array.from({length:15},()=>createPlayer({age:rand(18,22),ovr:rand(47,67),salary:1})),
    draft:Array.from({length:30},()=>createPlayer({age:rand(18,22),ovr:rand(47,67),salary:1})),
    fa:Array.from({length:12},()=>createPlayer({ovr:rand(56,75)})),
    news:[],tx:[],awards:[],history:[],train:8,last:null,stadiumLevel:0,stadiumUpgradeCost:100,championPremium:0,pendingDecision:null
  };
  game.roster.slice(0,3).forEach(p=>p.grade="Legend");
  addNews("🏟️ 구단 창단",`${club}의 ${game.year}년 시즌을 시작합니다. 시작 예산은 80억입니다.`,"good");
  save();
}
function addNews(title,body,type="neutral"){
  game.news.unshift({year:game.year,game:game.games,title,body,type});
  game.news=game.news.slice(0,150);
}
function addTx(type,p,note=""){
  game.tx.unshift({year:game.year,game:game.games,type,name:p.name,pos:p.pos,ovr:p.ovr,grade:p.grade,note});
}
function standings(){
  return [...game.league].sort((a,b)=>
    b.w/(b.w+b.l||1)-a.w/(a.w+a.l||1)||b.run-a.run
  ).map((x,i)=>({...x,rank:i+1}));
}
function myRank(){return standings().find(x=>x.name===game.club)?.rank||10}
function rosterPower(){
  const top=[...game.roster].sort((a,b)=>b.ovr-a.ovr).slice(0,9);
  if(!top.length)return 50;
  return top.reduce((s,p)=>s+p.ovr,0)/top.length-top.reduce((s,p)=>s+p.fatigue,0)/top.length*.08;
}
function xpMultiplier(){return 1+(game.stadiumLevel||0)*.08+(game.championPremium||0)/100}
function avatar(p){return `<div class="avatar">${p.foreign?"🌎":(["SP","RP"].includes(p.pos)?"⚾":"👤")}</div>`}
function stats(p){
  if(["SP","RP"].includes(p.pos))return `${p.w}승 ${p.l}패 · ERA ${p.era.toFixed(2)}`;
  return `${p.ab?(p.h/p.ab).toFixed(3):".000"} · ${p.hr}HR · ${p.rbi}RBI`;
}
function playerCard(p,buttons=true){
  return `<div class="panel"><div class="player">${avatar(p)}<div><h3>${esc(p.name)}</h3>
  <span class="tag">${p.pos}</span><span class="tag">OVR ${p.ovr}</span><span class="tag ${p.grade}">${p.grade}</span>
  <p class="muted">${p.age}세 · 연봉 ${p.salary}억 · 계약 ${p.left}년${p.foreign?" · 외국인":""}</p></div></div>
  <p>📊 ${stats(p)}</p><p>XP ${p.xp}/${p.need}</p><div class="progress"><div style="width:${cl(p.xp/p.need*100,0,100)}%"></div></div>
  ${buttons?`<div class="actions" style="margin-top:9px"><button class="btn gray" onclick="detailPlayer('${p.id}')">상세</button><button class="btn" onclick="renamePlayer('${p.id}')">이름 변경</button><button class="btn red" onclick="releasePlayer('${p.id}')">방출</button></div>`:""}</div>`;
}

function renderNav(){
  $("nav").innerHTML=NAV.map(([id,label])=>`<button class="nav ${page===id?"active":""}" onclick="go('${id}')">${label}</button>`).join("");
}
function updateTop(){
  $("club").textContent=game.club;$("year").textContent=game.year;$("money").textContent=money(game.budget)+"억";$("fan").textContent=game.morale;$("phase").textContent=" · "+game.phase;
}
function go(next){if(!game)return;page=next;renderNav();render()}
function render(){
  if(!game){startScreen();return}
  updateTop();renderNav();
  const pages={home:homePage,stadium:stadiumPage,roster:rosterPage,lineup:lineupPage,develop:developPage,draw:drawPage,scout:scoutPage,overseas:overseasPage,draft:draftPage,fa:faPage,trade:tradePage,season:seasonPage,news:newsPage,history:historyPage,awards:awardsPage};
  (pages[page]||homePage)($("content"));
}
function startScreen(){
  $("nav").innerHTML="";$("club").textContent="";$("phase").textContent="";$("year").textContent="";$("money").textContent="";$("fan").textContent="";
  $("content").innerHTML=`<div class="hero"><div><div class="muted">WELCOME</div><h1>⚾ BASEBALL SCOUTER</h1>
  <p>나만의 야구단을 만들고 스카우터 겸 단장으로 시즌을 운영하세요.</p>
  <div class="panel" style="max-width:650px;margin-top:18px"><h2>새 구단 만들기</h2><div class="form">
  <input id="clubIn" maxlength="20" placeholder="구단명"><input id="yearIn" type="number" value="2026" min="1900" max="2100">
  <button class="btn" onclick="createClub()">구단 만들기</button></div>
  <p class="muted">시작 예산 80억 · 시즌 10위로 종료해도 예산은 50억 미만으로 내려가지 않습니다.</p>
  <p class="muted">단, 뽑기·영입 등으로 직접 돈을 쓰는 경우에는 50억 아래로 내려갈 수 있습니다.</p></div></div></div>`;
}
function createClub(){
  const club=$("clubIn").value.trim(),year=$("yearIn").value;
  if(!club)return alert("구단명을 입력해주세요.");
  newGame(club,year);page="home";render();
}

function homePage(c){
  const t=game.league.find(x=>x.name===game.club);
  c.innerHTML=`<div class="hero"><div><div class="muted">BASEBALL SCOUTER</div><h1>🏟️ ${esc(game.club)}</h1>
  <p>${game.year}년 시즌 · ${game.games}/144경기</p><div class="actions">
  <button class="btn" onclick="go('season')">⚾ 시즌 진행</button><button class="btn gray" onclick="go('roster')">👥 선수단</button><button class="btn" onclick="go('draw')">🎰 선수 뽑기</button></div></div></div>
  <div class="grid" style="margin-top:15px"><div class="panel"><div class="muted">현재 순위</div><div class="stat">${myRank()}위</div><p>${t.w}승 ${t.l}패</p></div>
  <div class="panel"><div class="muted">예산</div><div class="stat gold">${money(game.budget)}억</div><p>시즌 10위 종료 하한선: ${MIN_BUDGET}억</p></div>
  <div class="panel"><div class="muted">팬 민심</div><div class="stat">${game.morale}</div><div class="progress"><div style="width:${game.morale}%"></div></div></div></div>
  <div class="grid2" style="margin-top:15px"><div class="panel"><h2>📊 20경기 리포트</h2>${game.last?`<p>${game.last.games}경기 · ${game.last.rank}위 · ${game.last.record}</p><p class="muted">${esc(game.last.stars)}</p>`:"<p class='muted'>20경기마다 현재 순위와 주전 기록이 갱신됩니다.</p>"}</div>
  <div class="panel"><h2>📰 최신 뉴스</h2>${game.news.slice(0,5).map(n=>`<div class="news"><b>${esc(n.title)}</b><div class="muted">${esc(n.body)}</div></div>`).join("")}</div></div>`;
}
function stadiumPage(c){
  const lvl=game.stadiumLevel,cost=lvl<5?100*(lvl+1):0;
  c.innerHTML=`<h1>🏗️ 구장 업그레이드</h1><div class="grid2"><div class="panel"><h2>${esc(game.club)} 스타디움</h2>
  <div class="stat">Lv.${lvl} / 5</div><p>육성 효율 보너스 <b class="good">+${lvl*8}%</b></p><div class="progress"><div style="width:${lvl*20}%"></div></div></div>
  <div class="panel"><h2>다음 레벨</h2>${lvl<5?`<p>비용 <b class="gold">${cost}억</b></p><p class="muted">Lv.1 100억 → Lv.2 200억 → Lv.3 300억 → Lv.4 400억 → Lv.5 500억</p>
  <button class="btn gold" onclick="upgradeStadium()">업그레이드</button>`:"<p class='good'>최고 레벨입니다.</p>"}</div></div>
  <div class="panel" style="margin-top:15px"><h2>👑 우승 프리미엄</h2><p>우승하면 다음 시즌 육성 효율이 +10% 증가합니다. 현재 보너스: <b class="good">+${game.championPremium}%</b></p></div>`;
}
function upgradeStadium(){
  const lvl=game.stadiumLevel;if(lvl>=5)return;
  const cost=100*(lvl+1);
  if(game.budget<cost){alert(`구장 업그레이드에 ${cost}억이 필요합니다.`);return}
  game.budget-=cost;game.stadiumLevel++;
  addNews("🏗️ 구장 업그레이드",`구장 레벨이 ${game.stadiumLevel}로 올라갔습니다. 육성 효율 +${game.stadiumLevel*8}%`,"good");
  save();render();
}
function rosterPage(c){
  c.innerHTML=`<h1>👥 선수단</h1><p class="muted">선수 이름은 기본 랜덤 이름으로 생성되며 원할 때 직접 변경할 수 있습니다.</p><div class="grid">${game.roster.map(p=>playerCard(p)).join("")}</div>`;
}

function startAuto(target){
  if(autoTimer)return;
  if(game.games>=144)return;
  const wanted=Math.min(target,144-game.games);
  let done=0;
  game.phase="시즌 진행 중";save();render();
  const step=()=>{
    if(game.pendingDecision){autoTimer=null;return}
    if(done>=wanted){autoTimer=null;save();render();return}
    simulateGame();done++;
    if(game.pendingDecision){autoTimer=null;render();return}
    render();
    autoTimer=setTimeout(step,target===1?900:100);
  };
  autoTimer=setTimeout(step,400);
}
function simulateGame(){
  if(game.games>=144)return;
  game.games++;
  game.phase="시즌 진행 중";
  const t=game.league.find(x=>x.name===game.club);
  const chance=clamp(.5+(rosterPower()-rand(56,86))/100,.25,.75);
  const win=Math.random()<chance;
  if(win){t.w++;t.run+=rand(2,9)}else{t.l++;t.run+=rand(0,5)}
  game.roster.forEach(p=>{
    p.games++;p.fatigue=clamp(p.fatigue+rand(1,4),0,100);
    gainXP(p,8);
    if(["SP","RP"].includes(p.pos)){
      if(Math.random()<.25)win?p.w++:p.l++;
      p.era=clamp(p.era+(Math.random()-.5)*.10,1.5,7.5);
    }else{
      p.ab+=rand(2,5);if(Math.random()<.25)p.h++;
      if(Math.random()<.035){p.hr++;p.rbi+=rand(1,3)}
    }
  });
  if(game.games%10===0){
    const e=pick([["🔥 선수단 분위기 상승",4],["😤 팬들의 불만",-5],["🌟 유망주 발견",2],["💥 타선 폭발",3],["📉 불펜 난조",-3]]);
    game.morale=clamp(game.morale+e[1],0,100);addNews(e[0],e[0].replace(/[🔥😤🌟💥📉]/g,""),e[1]>0?"good":"bad");
  }
  if(game.games%20===0){
    const stars=[...game.roster].sort((a,b)=>b.ovr-a.ovr).slice(0,5);
    game.last={games:game.games,rank:myRank(),record:`${t.w}승 ${t.l}패`,stars:stars.map(p=>`${p.name} ${stats(p)}`).join(" · ")};
    addNews("📊 20경기 리포트",`${game.games}경기 현재 ${myRank()}위입니다.`);
  }
  if(Math.random()<.075&&!game.pendingDecision)createDecision();
  if(game.games>=144){game.phase="정규시즌 종료";addNews("🏁 정규시즌 종료","144경기를 모두 마쳤습니다. 시즌 종료 버튼을 눌러 시상식을 확인하세요.","good")}
  save();
}
function createDecision(){
  const candidates=game.roster.length?game.roster:[];
  if(!candidates.length)return;
  const batting=Math.random()<.5,p=pick(candidates);
  game.pendingDecision={type:batting?"bat":"pitch",playerId:p.id};
  save();showDecision();
}
function showDecision(){
  const d=game.pendingDecision;if(!d)return;const p=game.roster.find(x=>x.id===d.playerId);if(!p){game.pendingDecision=null;return}
  const bat=d.type==="bat";
  const options=bat?[["💥 강하게 휘두르기",.62],["👁️ 공을 신중히 고르기",.70],["🛡️ 어떻게든 치기",.78]]:
    [["🔥 직구로 구위로 누르기",.62],["🎯 맞춰잡기",.72],["🌀 변화구로 도망가는 피칭",.80]];
  $("modalBox").innerHTML=`<h2>${bat?"🔥 결정적 타석 찬스!":"⚡ 결정적 투구 상황!"}</h2><p>${esc(p.name)}에게 중요한 승부가 찾아왔습니다.</p>
  <div class="grid">${options.map((o,i)=>`<button class="btn" onclick="resolveDecision(${i})">${o[0]}<br><small>성공 확률 약 ${Math.round(o[1]*100)}%</small></button>`).join("")}</div>`;
  $("modal").classList.remove("hidden");
}
function resolveDecision(i){
  const d=game.pendingDecision;if(!d)return;
  const bat=d.type==="bat",chance=(bat?[.62,.70,.78]:[.62,.72,.80])[i]||.7;
  const p=game.roster.find(x=>x.id===d.playerId);
  game.pendingDecision=null;closeModal();
  if(Math.random()<chance){
    game.morale=clamp(game.morale+2,0,100);
    if(p){if(bat){p.ab++;p.h++;if(i===0){p.hr++;p.rbi+=2}else p.rbi++;}else{p.w++;p.era=clamp(p.era-.15,1.2,7.5)}}
    addNews("✨ 결정적 승부 성공",`${p?p.name:"선수"}의 선택이 좋은 결과로 이어졌습니다.`,"good");
  }else{
    game.morale=clamp(game.morale-2,0,100);if(p&&bat)p.ab++;
    addNews("💢 결정적 승부 실패",`${p?p.name:"선수"}의 선택이 아쉽게 실패했습니다.`,"bad");
  }
  save();render();
  // 자동 진행은 사용자가 선택한 뒤 다시 시작할 수 있도록 안전하게 중지한다.
}
function finishSeason(){
  if(game.games<144)return alert("144경기를 모두 진행한 뒤 시즌을 종료할 수 있습니다.");
  const rank=myRank();
  const changes={1:70,2:55,3:45,4:35,5:25,6:15,7:5,8:-5,9:-10,10:-20};
  const change=changes[rank]??0,before=game.budget;
  game.budget=Math.max(MIN_BUDGET,game.budget+change);
  const batters=[...game.roster].filter(p=>!["SP","RP"].includes(p.pos));
  const pitchers=[...game.roster].filter(p=>["SP","RP"].includes(p.pos));
  const hr=batters.sort((a,b)=>b.hr-a.hr)[0],era=pitchers.sort((a,b)=>a.era-b.era)[0];
  const mvp=[...game.roster].sort((a,b)=>(b.hr*4+b.rbi+b.ovr+b.w*3)-(a.hr*4+a.rbi+a.ovr+a.w*3))[0];
  const gold=[...game.roster].sort((a,b)=>b.def-a.def)[0];
  const champion=rank===1;
  game.championPremium=champion?10:0;
  game.awards.unshift({year:game.year,rank,hr:hr?.name||"없음",era:era?.name||"없음",mvp:mvp?.name||"없음",gold:gold?.name||"없음",champion});
  game.history.unshift({year:game.year,rank,before,change,after:game.budget});
  addNews("🏁 시즌 종료",`${game.year}년 ${rank}위. 예산 ${change>=0?"+":""}${change}억`,"good");
  showSeasonAwards({year:game.year,rank,hr:hr?.name||"없음",era:era?.name||"없음",mvp:mvp?.name||"없음",gold:gold?.name||"없음",champion,budget:game.budget});
}
function showSeasonAwards(a){
  $("modalBox").innerHTML=`<h2>🏆 ${a.year}년 시즌 시상식</h2><p>최종 순위 <b>${a.rank}위</b> · 시즌 종료 후 예산 <b class="gold">${money(a.budget)}억</b></p>
  <div class="grid2"><div class="card"><b>💥 타이틀홀더</b><p>${esc(a.hr)}</p></div><div class="card"><b>⚡ 투수 타이틀</b><p>${esc(a.era)}</p></div>
  <div class="card"><b>👑 MVP</b><p>${esc(a.mvp)}</p></div><div class="card"><b>🧤 골든 글러브</b><p>${esc(a.gold)}</p></div></div>
  ${a.champion?`<div class="notice">👑 <b>우승 프리미엄 획득!</b><br>다음 시즌 선수 육성 효율이 +10% 증가합니다.</div>`:""}
  <button class="btn gold" onclick="advanceToNextSeason()">📅 다음 시즌으로</button>`;
  $("modal").classList.remove("hidden");
}
function advanceToNextSeason(){
  closeModal();
  game.roster=game.roster.filter(p=>{p.left--;if(p.left<=0){game.fa.push({...p,years:2,left:2});return false}return true});
  game.roster.forEach(p=>{p.age++;p.fatigue=clamp(p.fatigue-30,0,100);p.games=p.ab=p.h=p.hr=p.rbi=p.w=p.l=0});
  game.year++;game.games=0;game.phase="시즌 시작 전";game.league=makeLeague();
  game.prospects=Array.from({length:15},()=>createPlayer({age:rand(18,22),ovr:rand(47,67),salary:1}));
  game.draft=Array.from({length:30},()=>createPlayer({age:rand(18,22),ovr:rand(47,67),salary:1}));
  game.train=8;game.last=null;game.pendingDecision=null;
  addNews("📅 새 시즌 시작",`${game.year}년 시즌이 시작되었습니다. 전년도 우승 프리미엄 +${game.championPremium}%가 적용됩니다.`,"good");
  save();page="home";render();
}
function newsPage(c){
  c.innerHTML=`<h1>📰 뉴스</h1><div class="grid2"><div class="panel"><h2>❤️ 팬 민심</h2><div class="stat">${game.morale}/100</div><div class="progress"><div style="width:${game.morale}%"></div></div>
  <p class="muted">${game.morale>=80?"팬들의 기대가 매우 높습니다.":game.morale>=60?"팬들이 만족하고 있습니다.":game.morale>=40?"팬들의 반응이 엇갈립니다.":"팬들의 불만이 큽니다."}</p></div>
  <div class="panel"><h2>📅 현재 시즌</h2><div class="stat">${game.year}</div><p>${game.games}/144경기</p></div></div>
  <div class="panel" style="margin-top:15px">${game.news.map(n=>`<div class="news"><b>${esc(n.title)}</b><span class="tag">${n.year} · ${n.game}경기</span><p>${esc(n.body)}</p></div>`).join("")}</div>`;
}
function historyPage(c){
  c.innerHTML=`<h1>📜 거래 기록</h1><div class="panel table"><table><tr><th>연도</th><th>경기</th><th>구분</th><th>선수</th><th>포지션</th><th>OVR</th><th>등급</th><th>내용</th></tr>
  ${game.tx.map(x=>`<tr><td>${x.year}</td><td>${x.game}</td><td>${esc(x.type)}</td><td>${esc(x.name)}</td><td>${esc(x.pos)}</td><td>${x.ovr}</td><td class="${x.grade}">${esc(x.grade)}</td><td>${esc(x.note)}</td></tr>`).join("")}</table></div>`;
}
function awardsPage(c){
  c.innerHTML=`<h1>🏆 시즌 기록</h1><div class="grid">${game.awards.length?game.awards.map(a=>`<div class="panel"><h2>${a.year}년 시즌</h2><p>최종 순위 <b>${a.rank}위</b></p>
  <p>💥 타이틀홀더: ${esc(a.hr)}</p><p>⚡ 투수 타이틀: ${esc(a.era)}</p><p>👑 MVP: ${esc(a.mvp)}</p><p>🧤 골든 글러브: ${esc(a.gold)}</p>${a.champion?`<p class="good"><b>👑 우승 프리미엄 +10%</b></p>`:""}</div>`).join(""):"<div class='panel'>아직 종료된 시즌이 없습니다.</div>"}</div>`;
}

if(load()){render()}else{startScreen()}
</script>
</body>
</html>
